<g class="s1"><rect x="274" y="64" width="560" height="58" rx="14" fill="#2b3340"/><text x="290" y="87" fill="#e6edf3" clip-path="url(#ct2)">I&#x27;m in Madrid and want to visit Valencia by Ouigo in December 2026.</text><text x="290" y="109" fill="#e6edf3" clip-path="url(#ct3)">What&#x27;s the cheapest day to go, and which trains run that day?</text></g><g class="s4"><rect x="26" y="148" width="808" height="34" rx="8" fill="#21262d" stroke="#30363d"/><text x="40" y="170" fill="#8b949e" font-size="12.5">ouigo</text><text x="88" y="170" fill="#e6edf3" font-size="12.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">cheapest_days<tspan fill="#8b949e">(&quot;Madrid&quot;, &quot;Valencia&quot;, &quot;2026-12-01&quot;, &quot;2026-12-31&quot;)</tspan></text><text class="h5" x="820" y="170" text-anchor="end" fill="#8b949e" font-size="12.5">running…</text><text class="s6" x="820" y="170" text-anchor="end" fill="#3fb950" font-size="12.5">✓ 31 days</text></g><g class="s7"><text x="26" y="198" fill="#8b949e">Four days tie at €9: Dec 1, 2, 15 and 16. Pulling the trains for Dec 1.</text></g><g class="s8"><rect x="26" y="216" width="808" height="34" rx="8" fill="#21262d" stroke="#30363d"/><text x="40" y="238" fill="#8b949e" font-size="12.5">ouigo</text><text x="88" y="238" fill="#e6edf3" font-size="12.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">search_trains<tspan fill="#8b949e">(&quot;Madrid&quot;, &quot;Valencia&quot;, &quot;2026-12-01&quot;)</tspan></text><text class="h9" x="820" y="238" text-anchor="end" fill="#8b949e" font-size="12.5">running…</text><text class="s10" x="820" y="238" text-anchor="end" fill="#3fb950" font-size="12.5">✓ 4 trains</text></g><text class="s11" x="26" y="274"><tspan fill="#e6edf3" font-weight="600">Cheapest: </tspan><tspan fill="#ffa657" font-weight="700">€9</tspan><tspan fill="#e6edf3" font-weight="600"> (Esencial fare), on Tue 1, Wed 2, Tue 15 and Wed 16 Dec.</tspan></text><text class="s12" x="26" y="299"><tspan fill="#e6edf3">Trains on Tue 1 Dec, Madrid Chamartín → Valencia Joaquín Sorolla, direct:</tspan></text><g class="s13"><text x="36" y="324" fill="#8b949e" font-size="12.5">Depart</text><text x="146" y="324" fill="#8b949e" font-size="12.5">Arrive</text><text x="256" y="324" fill="#8b949e" font-size="12.5">Esencial</text><line x1="26" y1="331" x2="356" y2="331" stroke="#30363d"/></g><g class="s14"><text x="36" y="347" fill="#e6edf3">07:15</text><text x="146" y="347" fill="#e6edf3">09:09</text><text x="256" y="347" fill="#ffa657" font-weight="700">€9</text></g><g class="s15"><text x="36" y="370" fill="#e6edf3">12:15</text><text x="146" y="370" fill="#e6edf3">14:16</text><text x="256" y="370" fill="#e6edf3">€15</text></g><g class="s16"><text x="36" y="393" fill="#e6edf3">18:15</text><text x="146" y="393" fill="#e6edf3">20:09</text><text x="256" y="393" fill="#e6edf3">€19</text></g><g class="s17"><text x="36" y="416" fill="#e6edf3">21:15</text><text x="146" y="416" fill="#e6edf3">23:15</text><text x="256" y="416" fill="#e6edf3">€15</text></g><text class="s18" x="26" y="445" fill="#8b949e">Only the 07:15 gets €9 that day. One-way fare; fares fetched 20 Nov and can change.</text><text class="s19" x="26" y="468" fill="#e5007e">Book on Ouigo&#x27;s page: ventas.ouigo.com/…journey-search?…&amp;outboundDate=2026-12-01</text>

<text x="430.0" y="20" text-anchor="middle" fill="#8b949e" font-size="12">ouigo-iryo · Madrid → Valencia · real output (trimmed), Dec 2026</text>
<defs><clipPath id="ct2"><rect class="t2" x="22" y="50.5" height="21"/></clipPath><clipPath id="ct4"><rect class="t4" x="22" y="71.5" height="21"/></clipPath><clipPath id="ct9"><rect class="t9" x="22" y="168.1" height="21"/></clipPath><clipPath id="ct11"><rect class="t11" x="22" y="189.1" height="21"/></clipPath><clipPath id="ct16"><rect class="t16" x="22" y="285.70000000000005" height="21"/></clipPath></defs>
<g class="a1"><text x="22" y="64" clip-path="url(#ct2)"><tspan fill="#e5007e">$ </tspan><tspan fill="#e6edf3">ouigo calendar Madrid Valencia --from 2026-12-01 --to 2026-12-31 \</tspan></text></g><g class="a3"><text x="22" y="85" clip-path="url(#ct4)"><tspan fill="#e6edf3"></tspan><tspan fill="#e6edf3">  | jq -c &#x27;.cheapest, [.days[] | .price]&#x27;</tspan></text></g><text class="a5" x="22" y="106"><tspan fill="#e6edf3">{</tspan><tspan fill="#79c0ff">&quot;date&quot;</tspan><tspan fill="#e6edf3">:</tspan><tspan fill="#a5d6ff">&quot;2026-12-01&quot;</tspan><tspan fill="#e6edf3">,</tspan><tspan fill="#79c0ff">&quot;price&quot;</tspan><tspan fill="#e6edf3">:</tspan><tspan fill="#ffa657">9</tspan><tspan fill="#e6edf3">}</tspan></text><text class="a6" x="22" y="127"><tspan fill="#ffa657">[9,9,15,17,19,17,19,19,13,13,15,19,13,13,9,9,13,17,19,15,15,15,19,25,17,19,19,19,15,22,15]</tspan></text><text class="a7" x="22" y="148"><tspan fill="#8b949e"># cheapest Madrid -&gt; Valencia day in December: 9 EUR</tspan></text><g class="a8"><text x="22" y="181.6" clip-path="url(#ct9)"><tspan fill="#e5007e">$ </tspan><tspan fill="#e6edf3">ouigo search Madrid Valencia -d 2026-12-15 --sort price --limit 3 \</tspan></text></g><g class="a10"><text x="22" y="202.6" clip-path="url(#ct11)"><tspan fill="#e6edf3"></tspan><tspan fill="#e6edf3">  | jq -r &#x27;.trains[] | &quot;\(.departure[11:16]) \(.service) from \(.fares[0].price) EUR&quot;&#x27;</tspan></text></g><text class="a12" x="22" y="223.6"><tspan fill="#3fb950">07:15 06472 from 9 EUR</tspan></text><text class="a13" x="22" y="244.6"><tspan fill="#e6edf3">12:15 06822 from 17 EUR</tspan></text><text class="a14" x="22" y="265.6"><tspan fill="#e6edf3">17:45 06572 from 19 EUR</tspan></text><g class="a15"><text x="22" y="299.20000000000005" clip-path="url(#ct16)"><tspan fill="#e5007e">$ </tspan><tspan fill="#e6edf3">ouigo open Madrid Valencia -d 2026-12-15</tspan></text></g><text class="a17" x="22" y="320.20000000000005"><tspan fill="#e6edf3">{</tspan><tspan fill="#79c0ff">&quot;opened&quot;</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#ffa657">true</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#79c0ff">&quot;shop&quot;</tspan><tspan fill="#e6edf3">: {</tspan><tspan fill="#79c0ff">&quot;url&quot;</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#a5d6ff">&quot;https://ventas.ouigo.com/es-ES/_deeplink/journey-search?…</tspan></text><text class="a18" x="22" y="341.20000000000005"><tspan fill="#a5d6ff">  &amp;outboundDate=2026-12-15…&quot;</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#79c0ff">&quot;next&quot;</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#a5d6ff">&quot;Pick your train and fare on Ouigo&#x27;s page, then pay there.&quot;</tspan><tspan fill="#e6edf3">}}</tspan></text><text class="a19" x="22" y="362.20000000000005"><tspan fill="#8b949e"># you choose and pay on Ouigo&#x27;s own page; the tool never touches payment</tspan></text><text class="a20" x="22" y="383.20000000000005"><tspan fill="#e5007e">$ </tspan><tspan class="blink" fill="#e6edf3">▋</tspan></text>

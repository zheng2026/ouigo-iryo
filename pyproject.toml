[project]
name = "ouigo-es"
version = "0.1.0"
description = "Unofficial Ouigo Espana fare tool (CLI + MCP) that reads what Ouigo's own page receives"
readme = "README.md"
authors = [
    { name = "Jade Zheng" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2,<2",
    "playwright>=1.65.2",
]

[project.scripts]
ouigo = "ouigo_es.cli:main"
iryo = "ouigo_es.iryo_cli:main"
ouigo-mcp = "ouigo_es.mcp_server:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
markers = ["live: real network search (skipped by default)"]
addopts = "-m 'not live'"
